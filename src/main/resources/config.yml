database:
  adapter: postgresql
  host: localhost
  port: 5432
  name: minecraft
  username: minecraft
  password: change-me
  maximum-pool-size: 10
  connection-timeout-ms: 5000

maintenance:
  # One explicit CMI enable per plugin generation; NEVER automatically reopens.
  # Nonblank single line, maximum 512 characters; invalid values use the default.
  message: 'Database unavailable. Please try again later.'
  # Delay after each completed check; clamped to 5–300 seconds.
  health-check-interval-seconds: 30

migrations:
  # apply: run pending scripts. verify: never change the database; a plugin whose scripts are not all applied fails.
  # Run apply on one server per database and verify on the others. Anything else than apply or verify means verify.
  mode: apply
  # How long a script waits for a table lock before it fails; clamped to 1–300 seconds.
  lock-timeout-seconds: 10
